repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: unresolved-citation-marker
        name: unresolved citation marker
        entry: python scripts/check_citations.py
        language: system
        files: \.(py|ts|tsx|js|jsx|ya?ml|md|toml)$
