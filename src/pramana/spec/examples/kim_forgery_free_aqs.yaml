# NO FORGEABLE QUANTUM MESSAGE EXISTS FOR THIS SCHEME.
#
# The only bundled scheme that clears the static audit. Kim, Lee & Lee
# (arXiv:1708.05111) Corollary 5: an AQS scheme with assistant unitary
#
#     W = (i*sigma_1 - i*sigma_2 + i*sigma_3)/sqrt(3)
#
# and three or more random rotations has no forgeable quantum message. Their
# Theorem 4 terms are alpha_l = -1/6, beta_m = 1/3, gamma_n = -1/3 for every
# index -- none vanishes, so W is in no W_lmn.
#
# THE TWO HALVES OF THIS SCHEME'S STATUS, BOTH OF WHICH MUST BE STATED:
#
#   Static audit      CLEARS. D1 reads four real coefficients and never
#                     simulates, so the non-Clifford assistant is no obstacle to
#                     auditing it. Zero Pauli witnesses, and not forgeable under
#                     Theorem 4.
#
#   Runtime attack    OUT OF SCOPE. W is non-Clifford -- a pi rotation about the
#   simulation        (1,-1,1)/sqrt(3) body diagonal -- so it has no stabilizer
#                     tableau and the engines refuse it. This is ledger V-27, a
#                     scope fact, not an apology: every element of the 24-element
#                     Clifford group is forgeable, so a forgery-free assistant
#                     unitary is NECESSARILY non-Clifford. The schemes worth
#                     reaching for are exactly the ones Stim cannot run.
#
# NAME COLLISION: Kim et al. call this operator "T". It is NOT the T gate
# (diag(1, exp(i*pi/4))). It is registered as W_kim_forgery_free precisely so the
# two can never be confused.

name: kim_forgery_free_aqs
reference: >-
  Kim, Lee, Lee, Forgeable quantum messages in arbitrated quantum signature
  schemes, arXiv:1708.05111 (2018), Corollary 5: assistant unitary
  (i*sigma_1 - i*sigma_2 + i*sigma_3)/sqrt(3) with three or more random
  rotations admits no forgeable quantum message. The scheme is taken from that
  paper, not derived by this project. Its Theorem 4 coefficients were verified
  independently here (ledger V-28) before being relied on.

message_type: classical

entanglement:
  resource: bell
  pairs_per_signature_qubit: 1

signature:
  length_qubits: 8

rotation:
  family: pauli
  left_factor: [I]
  right_factor: [I]

# Three or more random rotations, which is what puts this scheme in Theorem 4's
# regime rather than Theorem 1's. With only two, a forgeable message would exist
# for any assistant unitary whatsoever and the choice of W could not help.
#
# NOTE ON WHAT THIS FIELD DOES AND DOES NOT SAY: it records how many independent
# random rotations the protocol draws from. It does NOT name them -- the schema
# models the count, because the count is all Kim's Theorems 1 and 4 branch on.
# See docs/derivations.md section 5.3c.
rotation_count: 3

# The assistant unitary is declared here rather than as a signing_encryption
# factor, because factors must be Clifford (they feed the exact tableau algebra)
# and this one is not. A scheme declares its assistant one way or the other,
# never both.
signing_encryption:
  family: pauli
  left_factor: [I]
  right_factor: [I]

assistant_unitary: W_kim_forgery_free

classical_outcomes:
  used_in_verification: false
  protection: wegman_carter

binding:
  positional: true

arbitrator:
  count: 1
  threshold: 1
  trust: semi_trusted

probes:
  enabled: true
  basis_set: six_state
  rounds_per_signature: 32

verification:
  correction_rule: pauli_standard
  equality_test: projective
